name: System Health Report CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Python Tests
        run: |
          pytest


  build:
    name: Generate Health Report
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Python Application
        run: |
          python app.py

      - name: Upload Health Report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health_report.txt


  deploy:
    name: Download Health Report
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: health-report
          path: report/

      - name: Display Health Report
        run: |
          cat report/health_report.txt